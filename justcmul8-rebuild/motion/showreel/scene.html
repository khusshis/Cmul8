<!doctype html>
<html><head><meta charset="utf-8"><title>JustCmul8 Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fafaff;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fafaff;font-family:Inter,sans-serif;color:#161622;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body.preview #stage{transform-origin:0 0}
.abs{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.orb{position:absolute;left:0;top:0;width:1200px;height:1200px;border-radius:50%;margin:-600px 0 0 -600px}
#gridW{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 20%,transparent 85%)}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(99,102,241,.2) 1.5px,transparent 2px);background-size:44px 44px}
.spk{position:absolute;left:0;top:0;color:#8b5cf6;font-size:22px;line-height:1}
.sg{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.gt{background:linear-gradient(90deg,#8b5cf6,#5742FF 55%,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#fff;border:1px solid #ecebf7;border-radius:28px;box-shadow:0 40px 80px -30px rgba(87,66,255,.25),0 10px 24px -12px rgba(22,22,34,.10)}
.mask{display:inline-block;overflow:hidden;padding:0 .03em .14em;margin-bottom:-.14em;vertical-align:bottom}
.in{display:inline-block}
.row{display:flex;align-items:center;white-space:nowrap}
/* cube */
#cubeW{width:0;height:0}
#cglow{position:absolute;left:-360px;top:-360px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(87,66,255,.45),rgba(139,92,246,.18) 40%,transparent 68%)}
#mk{position:absolute;left:-125.8px;top:-150px;width:251.6px;height:300px}
#mk img{position:absolute;left:0;top:0;width:100%;height:100%}
/* prompt */
#pill{border-radius:60px}
.btn{background:linear-gradient(90deg,#8b5cf6,#5742FF);color:#fff;font-weight:700;border-radius:999px;box-shadow:0 12px 30px -8px rgba(87,66,255,.55)}
.chip{display:flex;align-items:center;gap:10px;padding:0 20px;height:48px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #e4defd;box-shadow:0 8px 24px -8px rgba(139,92,246,.3);font-weight:700;font-size:15px;letter-spacing:.14em;color:#6366f1;white-space:nowrap}
/* canvas */
.node{width:190px;height:88px;background:#fff;border-radius:20px;border:1.5px solid #e7e5f6;box-shadow:0 18px 36px -16px rgba(60,50,160,.28);display:flex;align-items:center;gap:12px;padding:0 14px}
.ni{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
.nt{font-weight:700;font-size:17px;letter-spacing:-.01em}
.ns{font-size:12.5px;color:#64748b;font-weight:500;margin-top:2px;display:flex;gap:5px;align-items:center}
.nb{position:absolute;top:-13px;right:-11px;min-width:30px;height:28px;border-radius:14px;color:#fff;font:700 14px Inter;display:grid;place-items:center;padding:0 9px;box-shadow:0 6px 14px -4px rgba(0,0,0,.25)}
.bd{width:9px;height:9px;border-radius:50%;background:#d7f3f1;display:inline-block}
#cgrid{width:1600px;height:790px;border-radius:0 0 30px 30px;background-image:radial-gradient(rgba(99,102,241,.22) 1.4px,transparent 1.8px);background-size:28px 28px;background-color:#fbfbff}
#beam{width:220px;height:790px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.10) 60%,rgba(87,66,255,.5) 97%,transparent);border-right:2px solid #8b5cf6}
.hdr{font-weight:700;font-size:24px}
.seg{display:flex;background:#f3f2fb;border-radius:14px;padding:5px;gap:4px;font-weight:600;font-size:15px;color:#64748b}
.seg div{padding:9px 20px;border-radius:10px}
.seg .on{background:#fff;color:#161622;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.status{height:40px;border-radius:20px;padding:0 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.toast{height:64px;border-radius:32px;padding:0 26px 0 12px;background:#161622;color:#fff;font-weight:600;font-size:18px;box-shadow:0 20px 40px -12px rgba(22,22,34,.45)}
.warn{height:54px;border-radius:27px;padding:0 20px 0 10px;background:#fff7ed;border:1.5px solid #fdba74;color:#c2410c;font-weight:700;font-size:16px;box-shadow:0 14px 30px -10px rgba(249,115,22,.45)}
/* dashboard */
.kpi{width:500px;height:190px;padding:26px 30px}
.kl{font-size:13px;font-weight:700;letter-spacing:.14em;color:#94a3b8;display:flex;gap:10px;align-items:center}
.kv{font-size:68px;font-weight:700;letter-spacing:-.03em;margin-top:14px;line-height:1}
.kv small{font-size:26px;color:#94a3b8;margin-left:6px;font-weight:600}
.dl{position:absolute;left:30px;bottom:24px;font-size:14px;font-weight:700;border-radius:10px;padding:5px 10px}
.ct{font-size:20px;font-weight:700;letter-spacing:-.01em}
.cs{font-size:14px;color:#94a3b8;font-weight:500;margin-top:4px}
.face{position:absolute;inset:0;backface-visibility:hidden;padding:28px 30px}
.bl{font-size:16px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:10px}
.bt{height:22px;border-radius:11px;background:#f1f0fa;overflow:hidden}
.bf{height:100%;border-radius:11px;transform-origin:0 50%}
/* s5 / outro */
.tile{width:170px;height:170px;border-radius:40px;background:#fff;border:1px solid #ecebf7;box-shadow:0 30px 60px -24px rgba(87,66,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:15px}
.tile .ti{width:74px;height:74px;border-radius:22px;display:grid;place-items:center}
#roll{width:1600px;height:150px;overflow:hidden}
#roll div{height:150px;line-height:150px;text-align:center;font-size:124px;font-weight:700;letter-spacing:-.035em}
.ltr{display:inline-block}
.cta{height:100px;padding:0 44px;font-size:30px;display:flex;align-items:center;gap:16px;overflow:hidden;position:relative}
.shine{position:absolute;top:-20px;bottom:-20px;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.ring{border-radius:50%;border:3px solid #8b5cf6}
.pt{border-radius:50%}
#cursor{position:absolute;left:0;top:0;width:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));z-index:50}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:60}
</style></head>
<body>
<div id="stage">
  <div id="orbs"></div>
  <div id="gridW"><div id="grid"></div></div>
  <div id="spks"></div>
  <div id="world"></div>
  <svg id="cursor" viewBox="0 0 40 56"><path d="M3 3 L3 41 L12.5 32 L19 47 L25.5 44.2 L19.2 29.8 L32 29.8 Z" fill="#161622" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
  <div id="flash"></div>
</div>
<script src="icons.js"></script>
<script>
/* ---------- helpers (springs adapted from Barty-Bart/motion-graphics, MIT) ---------- */
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const eo=x=>1-Math.pow(1-clamp(x),3);
const eo5=x=>1-Math.pow(1-clamp(x),5);
const ei=x=>Math.pow(clamp(x),3);
const eio=x=>{x=clamp(x);return x*x*x*(x*(6*x-15)+10)};
const ss=x=>{x=clamp(x);return x*x*(3-2*x)};
const S=(tau,w,z)=>{if(tau<=0)return 0;if(!isFinite(w))return 1;
  if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+z*w/wd*Math.sin(wd*tau));}
  return 1-Math.exp(-w*tau)*(1+w*tau);};
const spr=(t,t0,w=14,z=0.6)=>S(t-t0,w,z);
const INST=[Infinity,1];
const track=(v0,keys,def=[10,0.85])=>{let p=v0;const ks=[];for(const k of keys){const d=k[1]-p;p=k[1];const sp=k[2]||def;if(d)ks.push([k[0],d,sp[0],sp[1]]);}
  return t=>{let v=v0;for(const k of ks)v+=k[1]*S(t-k[0],k[2],k[3]);return v;};};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const gauss=i=>Math.sqrt(-2*Math.log(rnd(i)+1e-6))*Math.cos(6.2832*rnd(i+999));
// in/out window: returns {a (in 0..1), b (out 0..1), o}
const win=(t,tin,tout,li=.3,lo=.25)=>{const a=tin==null?1:eo((t-tin)/li), b=tout==null?0:ei((t-tout)/lo);return {a,b,o:a*(1-b)};};
const ic=(n,s,c,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const W=$('world');
const mk=(html,cls='abs',parent=W)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;parent.appendChild(d);return d;};
const svgNS='http://www.w3.org/2000/svg';
function put(el,x,y,{s=1,o=1,r=0,b=0,ax='-50%',ay='-50%',sx=1,sy=1}={}){
  if(o<=0.003||s<=0.002){if(el._v!==0){el.style.display='none';el._v=0;}return false;}
  if(el._v!==1){el.style.display='';el._v=1;}
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(${ax},${ay}) rotate(${r.toFixed(3)}deg) scale(${(s*sx).toFixed(4)},${(s*sy).toFixed(4)})`;
  el.style.opacity=Math.min(1,o).toFixed(3);
  el.style.filter=b>0.2?`blur(${b.toFixed(2)}px)`:'none';
  return true;
}
const txt=(el,s)=>{if(el._t!==s){el.textContent=s;el._t=s;}};
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---------- background ---------- */
const ORB=[['#d6ccff',.55,-300,-200,0],['#e0d6ff',.6,1500,150,1.7],['#d8b4fe',.35,1300,1000,3.1],['#c7d2fe',.45,300,1000,4.4],['#ffd9d3',.25,1800,-100,2.2]];
const orbs=ORB.map(([c,a])=>mk('', 'orb', $('orbs'))).map((d,i)=>{d.style.background=`radial-gradient(circle,${ORB[i][0]} 0%,transparent 62%)`;d.style.opacity=ORB[i][1];return d;});
const SPK=[...Array(16)].map((_,i)=>{const d=mk(i%3?'✦':'●','spk',$('spks'));d.style.fontSize=(i%3?14+rnd(i)*18:6+rnd(i)*6)+'px';return d;});

/* ---------- S1 logo cube + words ---------- */
// the real JustCmul8 mark (public/logo-transparent.png), cut into its three cube faces for the assembly
const FACEP=['50% 0%,100% 23.56%,50% 46.01%,0% 23.75%','0% 23.75%,50% 46.01%,50% 100%,0% 100%','50% 46.01%,100% 23.56%,100% 100%,50% 100%'];
const cubeW=mk('<div id="cglow"></div><div id="mk"><img id="mfull" src="logo-mark.png">'+FACEP.map(c=>`<img class="mp" src="logo-mark.png" style="clip-path:polygon(${c})">`).join('')+'</div>','abs');
cubeW.id='cubeW';
const MFULL=cubeW.querySelector('#mfull'),MP=[...cubeW.querySelectorAll('.mp')];const MPOFF=[[0,-320,-35],[-300,180,28],[300,180,-28]];
const S1W=mk(['Model.','Simulate.','Optimize.'].map((w,i)=>`<span class="mask"><span class="in ${i==2?'gt':''}">${w}</span></span>`).join('<span style="display:inline-block;width:.28em"></span>'),'abs sg');
S1W.style.cssText+='font-size:104px;font-weight:700;letter-spacing:-.035em;white-space:nowrap';
const s1in=[...S1W.querySelectorAll('.in')];

/* ---------- S2 prompt ---------- */
const S2H=mk('<span class="mask"><span class="in">Describe it.</span></span> <span class="mask"><span class="in gt">We build it.</span></span>','abs sg');
S2H.style.cssText+='font-size:84px;font-weight:700;letter-spacing:-.035em;white-space:nowrap';
const s2in=[...S2H.querySelectorAll('.in')];
const badge=mk(`${ic('sparkles',18,'#6366f1',2.2)}AI ASSISTANT`,'abs chip');
const glowP=mk('','abs');glowP.style.cssText+='width:1300px;height:220px;border-radius:110px;background:linear-gradient(90deg,rgba(139,92,246,.45),rgba(99,102,241,.45),rgba(217,70,239,.35));filter:blur(40px)';
const pill=mk('','abs card');pill.id='pill';
const ptxt=mk('<span id="pt"></span><span id="caret" style="display:inline-block;width:3px;height:36px;background:#8b5cf6;margin-left:3px;vertical-align:-7px;border-radius:2px"></span>','abs');
ptxt.style.cssText+='font-size:30px;font-weight:500;color:#334155;white-space:nowrap';
const PROMPT='A coffee shop with 3 baristas at rush hour';
const pbtn=mk(`Generate with AI ${ic('arrow-right',24,'#fff',2.6)}`,'abs btn row');pbtn.style.cssText+='height:92px;padding:0 34px;gap:12px;font-size:24px;overflow:hidden';
const pshine=mk('','abs shine',pbtn);

/* ---------- S3 canvas ---------- */
const cgrid=mk('','abs');cgrid.id='cgrid';
const beam=mk('','abs');beam.id='beam';
const N=[ // x,y,color,icon,title,sub
 [-620,55,'#2f6fed','users','Customers','λ 2.0 / min'],
 [-330,55,'#8b5cf6','list-ordered','Order Line','FIFO queue'],
 [-40,55,'#0ea5a5','coffee','Baristas','<span class=bd></span><span class=bd></span><span class=bd></span>'],
 [250,55,'#d9a400','git-branch','Dine in?','60 / 40 split'],
 [580,-110,'#12a150','armchair','Tables','12 seats'],
 [580,220,'#6b6b7b','log-out','Exit','departures']];
const esvg=document.createElementNS(svgNS,'svg');esvg.setAttribute('class','abs');esvg.setAttribute('width',1);esvg.setAttribute('height',1);esvg.style.overflow='visible';W.appendChild(esvg);
const EDG=[[0,1,'M-525,55 L-425,55'],[1,2,'M-235,55 L-135,55'],[2,3,'M55,55 L155,55'],[3,4,'M345,55 C420,55 410,-110 485,-110'],[3,5,'M345,55 C420,55 410,220 485,220'],[4,5,'M580,-66 L580,176']];
const edges=EDG.map(([a,b,d])=>{const g=document.createElementNS(svgNS,'g');g.innerHTML=`<path d="${d}" fill="none" stroke="#c4bdfb" stroke-width="4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 14"/>`;esvg.appendChild(g);const [p,f]=g.children;const L=p.getTotalLength();p.style.strokeDasharray=L;return {g,p,f,L,a,b};});
const nodes=N.map(([x,y,c,i,tt,sb],k)=>mk(`<div class="ni" style="background:${c}1f">${ic(i,26,c,2.2)}</div><div><div class="nt">${tt}</div><div class="ns">${sb}</div></div><div class="nb" style="background:${c}">0</div>`,'abs node'));
const nb=nodes.map(n=>n.querySelector('.nb'));
const bdots=[...nodes[2].querySelectorAll('.bd')];
const tsvg=document.createElementNS(svgNS,'svg');tsvg.setAttribute('class','abs');tsvg.setAttribute('width',1);tsvg.setAttribute('height',1);tsvg.style.overflow='visible';W.appendChild(tsvg);
const hdrL=mk(`<span class="hdr sg">Coffee Shop · Rush Hour</span><span style="margin-left:16px;font-size:13px;font-weight:700;color:#7c3aed;background:#f5f3ff;border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:center">${ic('sparkles',14,'#7c3aed')}AI GENERATED</span>`,'abs row');
const hdrM=mk('<div class="seg"><div class="on">Canvas</div><div>Results</div><div>Code</div></div>','abs');
const clock=mk('00:00:00','abs mono');clock.style.cssText+='font-size:20px;font-weight:700;color:#64748b';
const status=mk('<span id="sdot" style="width:10px;height:10px;border-radius:50%;background:#94a3b8"></span><span id="stx">Ready</span>','abs status');
const runB=mk(`<span id="rico">${ic('play',20,'#fff',2.5)}</span><span id="rtx">Run</span>`,'abs btn row');runB.style.cssText+='height:52px;padding:0 24px;gap:8px;font-size:18px';
const hline=mk('','abs');hline.style.cssText+='width:1600px;height:1px;background:#ecebf7';
const toast=mk(`<span style="width:42px;height:42px;border-radius:21px;background:linear-gradient(135deg,#8b5cf6,#5742FF);display:grid;place-items:center">${ic('sparkles',22,'#fff')}</span>Generated 6 blocks from your prompt`,'abs toast row');toast.style.gap='14px';
const warn=mk(`<span style="width:36px;height:36px;border-radius:18px;background:#f97316;display:grid;place-items:center">${ic('triangle-alert',20,'#fff',2.4)}</span>Bottleneck detected · Order Line`,'abs warn row');warn.style.gap='12px';
const pulses=[0,1,2].map(()=>{const d=mk('','abs');d.style.cssText+='width:190px;height:88px;border-radius:22px;border:3px solid #f97316';return d;});

// --- a real (tiny) discrete-event run: FIFO queue, 3 servers ---
const TK=[];{let ta=6.95;const free=[0,0,0];
 for(let i=0;i<34;i++){const a=ta;ta+=0.05+0.14*rnd(i+1);const q=a+0.28;
  let k=0;for(let j=1;j<3;j++)if(free[j]<free[k])k=j;
  const qs=Math.max(q+0.2,free[k]-0.35),s0=qs+0.35,se=s0+0.55+0.45*rnd(i+50);free[k]=se;
  const d=se+0.22,dine=rnd(i+90)<0.6,ex=dine?d+1.05:d+0.35;TK.push({a,q,qs,s0,se,d,dine,ex,k});}}
const tokEls=TK.map(()=>{const c=document.createElementNS(svgNS,'circle');c.setAttribute('r',8);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',2.5);tsvg.appendChild(c);return c;});
const at=(e,u)=>{const p=edges[e].p.getPointAtLength(edges[e].L*clamp(u));return [p.x,p.y];};
const QX=-330,QY=128;
function tokPos(i,t){const k=TK[i];
 const slot=()=>{let n=0;for(let j=0;j<i;j++){const kj=TK[j];if(kj.q<=t)n+=t<kj.qs?1:1-eio((t-kj.qs)/0.3);}return [QX,QY+24*n];};
 if(t<k.a)return null;
 if(t<k.q)return [...at(0,ss((t-k.a)/0.28)),'#2f6fed'];
 if(t<k.qs){const [sx,sy]=slot();const u=eio((t-k.q)/0.2);return [lerp(-425,sx,u),lerp(55,sy,u),'#8b5cf6'];}
 if(t<k.qs+0.15){const [sx,sy]=slot();const u=eio((t-k.qs)/0.15);return [lerp(sx,-235,u),lerp(sy,55,u),'#8b5cf6'];}
 if(t<k.s0)return [...at(1,ss((t-k.qs-0.15)/0.2)),'#8b5cf6'];
 if(t<k.se)return null;
 if(t<k.d)return [...at(2,ss((t-k.se)/0.22)),'#0ea5a5'];
 if(k.dine){if(t<k.d+0.3)return [...at(3,ss((t-k.d)/0.3)),'#12a150'];if(t<k.d+0.75)return null;if(t<k.ex)return [...at(5,ss((t-k.d-0.75)/0.3)),'#12a150'];return null;}
 if(t<k.ex)return [...at(4,ss((t-k.d)/0.35)),'#f97316'];return null;}
// pop times: node pops when scan beam passes it
const beamX=t=>-800+1760*eio((t-5.3)/0.85);
const POP=N.map(([x])=>{for(let t=5.3;t<7;t+=0.002)if(beamX(t)>=x-150)return t;return 6;});
const EDT=EDG.map(([a,b])=>Math.max(POP[a],POP[b])+0.06);

/* ---------- S4 dashboard ---------- */
const DX=2400;
const dT=mk(`<div class="row" style="gap:16px"><span style="width:56px;height:56px;border-radius:16px;background:#f5f3ff;display:grid;place-items:center">${ic('activity',28,'#7c3aed',2.4)}</span><div><div class="sg" style="font-size:40px;font-weight:700;letter-spacing:-.03em">Simulation Results</div><div style="font-size:16px;color:#94a3b8;font-weight:500">Coffee Shop · Rush Hour · 2h simulated</div></div></div>`,'abs');
const spark='M0,48 C20,44 30,30 50,34 C70,38 80,18 100,20 C120,22 130,8 150,6';
const K=[
