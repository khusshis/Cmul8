/* ---------- helpers (springs adapted from Barty-Bart/motion-graphics, MIT) — same toolkit as the landing showreel ---------- */
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;

const S=(tau,w,z)=>{if(tau<=0)return 0;if(!isFinite(w))return 1;

  return t=>{let v=v0;for(const k of ks)v+=k[1]*S(t-k[0],k[2],k[3]);return v;};};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

const win=(t,tin,tout,li=.3,lo=.25)=>{const a=tin==null?1:eo((t-tin)/li), b=tout==null?0:ei((t-tout)/lo);return {a,b,o:a*(1-b)};};
const ic=(n,s,c,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const W=$('world');
const mk=(html,cls='abs',parent=W)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;parent.appendChild(d);return d;};

const sel=(tag,attrs,parent)=>{const e=document.createElementNS(svgNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;};
function put(el,x,y,{s=1,o=1,r=0,b=0,ax='-50%',ay='-50%',sx=1,sy=1}={}){
  if(o<=0.003||s<=0.002){if(el._v!==0){el.style.display='none';el._v=0;}return false;}
  if(el._v!==1){el.style.display='';el._v=1;}
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(${ax},${ay}) rotate(${r.toFixed(3)}deg) scale(${(s*sx).toFixed(4)},${(s*sy).toFixed(4)})`;
  el.style.opacity=Math.min(1,o).toFixed(3);el.style.filter=b>0.2?`blur(${b.toFixed(2)}px)`:'none';return true;}
const show=(el,on)=>{if(el._v!==(on?1:0)){el.style.display=on?'':'none';el._v=on?1:0;}return on;};
const txt=(el,s)=>{if(el._t!==s){el.textContent=s;el._t=s;}};

// typography: each letter rises out of its word mask with blur-to-sharp; *accent* words are serif italics with a moving shimmer
const ACC=['#7c3aed','#6d28d9','#5b21b6','#4c1d95','#4338ca'] /* deep enough to read on white */,ALT=['#fb923c','#f97316','#ef4444','#dc2626'];
const mixc=(a,b,u)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*u).toString(16).padStart(2,'0')).join('');};
const ramp=(cs,u)=>{const f=clamp(u)*(cs.length-1),i=Math.min(cs.length-2,Math.floor(f));return mixc(cs[i],cs[i+1],f-i);};
const kt=(str,css,kick)=>{const html=str.split('/').map(line=>line.trim().split(' ').map(w=>{let c='';if('*^~'.includes(w[0])){c={'*':'acc','^':'alt','~':'gq'}[w[0]];w=w.slice(1);}
  return `<span class="mask"><span class="in ${c}">${[...w].map(ch=>`<span class="ch">${ch}</span>`).join('')}</span></span>`;}).join('<span class="sp"></span>')).join('<br>');
 const el=mk((kick?`<div class="kick"><b></b>${kick}<b></b></div>`:'')+html,'abs sg kt');el.style.cssText+=css;
 el.chs=[...el.querySelectorAll('.ch')];el.kk=el.querySelector('.kick');
 const acc=[...el.querySelectorAll('.acc .ch')],alt=[...el.querySelectorAll('.alt .ch')];acc.forEach((c,i)=>{c._c=ramp(ACC,i/Math.max(1,acc.length-1));c.style.color=c._c;});alt.forEach((c,i)=>c.style.color=ramp(ALT,i/Math.max(1,alt.length-1)));
 el.acc=acc;return el;};
function kin(el,t,t0,out){const n=el.chs.length;
 el.chs.forEach((e,j)=>{const a=spr(t,t0+j*0.022,19,.72),b=out==null?0:ei((t-out-j*0.008)/0.22);
  e.style.transform=`translateY(${((1-a)*108-b*108).toFixed(2)}%) rotate(${((1-a)*9).toFixed(2)}deg)`;const bb=(1-clamp(a))*10+b*10;e.style.filter=bb>0.2?`blur(${bb.toFixed(2)}px)`:'none';});
 // shimmer travelling through the accent letters

 if(el.kk){const a=eo((t-t0+0.12)/0.35),b=out==null?0:ei((t-out)/0.2);el.kk.style.opacity=(a*(1-b)).toFixed(3);el.kk.style.letterSpacing=lerp(0.62,0.32,a).toFixed(3)+'em';}}
const A=TL.A;
const S7=[10,.9],S8=[12,.88],S10=[14,.85],S12=[16,.82]; // stiffer than the landing video: this cut runs faster

/* ---------- background (same orbs, dot grid and sparkles as the landing video) ---------- */
const ORB=[['#d6ccff',.55,-300,-200,0],['#e0d6ff',.6,1500,150,1.7],['#d8b4fe',.35,1300,1000,3.1],['#c7d2fe',.45,300,1000,4.4],['#ffd9d3',.25,1800,-100,2.2]];
const orbs=ORB.map(([c,a])=>{const d=mk('','orb',$('orbs'));d.style.background=`radial-gradient(circle,${c} 0%,transparent 62%)`;d.style.opacity=a;return d;});
const SPK=[...Array(18)].map((_,i)=>{const d=mk(i%3?'✦':'●','spk',$('spks'));d.style.fontSize=(i%3?14+rnd(i)*18:6+rnd(i)*6)+'px';return d;});
{const g=document.createElement('canvas');g.width=g.height=256;const c=g.getContext('2d'),im=c.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=128+Math.random()*127;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}c.putImageData(im,0,0);$('grain').style.backgroundImage=`url(${g.toDataURL()})`;}

/* ---------- shared bits ---------- */
const FACEP=['50% 0%,100% 23.56%,50% 46.01%,0% 23.75%','0% 23.75%,50% 46.01%,50% 100%,0% 100%','50% 46.01%,100% 23.56%,100% 100%,50% 100%'];
const MPOFF=[[0,-320,-35],[-300,180,28],[300,180,-28]];
function makeCube(){const w=mk('<div class="cglow"></div><div class="mk"><img src="logo-mark.png">'+FACEP.map(c=>`<img src="logo-mark.png" style="clip-path:polygon(${c})">`).join('')+'</div>');w.style.width=w.style.height='0';const im=[...w.querySelectorAll('img')];return {w,full:im[0],parts:im.slice(1),glow:w.querySelector('.cglow')};}
function drawCube(c,t,t0,x,y,s,o=1){const a=spr(t,t0,8.5,.6),ex=Math.max(-6,420*(1-spr(t,t0,8,.72))),rot=-200*(1-spr(t,t0,6,.75));
 if(!put(c.w,x,y,{s:Math.max(0,a)*s,o:clamp((t-t0)/0.12)*o,r:rot}))return;const u=ex/420,split=Math.abs(ex)>0.6;c.full.style.display=split?'none':'';
 c.parts.forEach((m,i)=>{m.style.display=split?'':'none';if(split){const [dx,dy,dr]=MPOFF[i];m.style.transform=`translate(${(dx*u).toFixed(2)}px,${(dy*u).toFixed(2)}px) rotate(${(dr*u).toFixed(2)}deg)`;m.style.opacity=clamp(1-Math.max(0,u)*0.7).toFixed(3);}});
 c.glow.style.opacity=(0.55+0.45*Math.exp(-Math.max(0,t-t0-0.1)*2.2)).toFixed(3);c.glow.style.transform=`scale(${(0.8+0.5*Math.exp(-Math.max(0,t-t0)*2)).toFixed(3)})`;}
const PAL=['#8b5cf6','#5742FF','#d946ef','#ff6d5a','#6366f1','#22c55e'];
